<!-- @dsCard group="Bindery Web" viewport="1280x820" name="Bindery — full app" subtitle="Login → Library → Series → Reader, plus Discover. Click through it." -->
<!DOCTYPE html>
<html lang="en" class="dark" data-theme="">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bindery</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  /* Responsive grid: 6 cols → fewer on narrow widths */
  @media (max-width: 1100px) { .lib-grid { grid-template-columns: repeat(5, 1fr) !important; } }
  @media (max-width: 900px)  { .lib-grid { grid-template-columns: repeat(4, 1fr) !important; } }
  @media (max-width: 680px)  { .lib-grid { grid-template-columns: repeat(3, 1fr) !important; } }
  @media (max-width: 460px)  { .lib-grid { grid-template-columns: repeat(2, 1fr) !important; } }
  i[data-lucide] > svg { width: 100%; height: 100%; }
  @keyframes by-spin { to { transform: rotate(360deg); } }
  @media (max-width: 760px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .admin-cols { grid-template-columns: minmax(0,1fr) auto !important; }
    .admin-hide { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="lib.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Library.jsx"></script>
<script type="text/babel" src="Series.jsx"></script>
<script type="text/babel" src="Reader.jsx"></script>
<script type="text/babel" src="Discover.jsx"></script>
<script type="text/babel" src="Admin.jsx"></script>
<script type="text/babel">
  function App() {
    const [route, setRoute] = React.useState('login');
    const [series, setSeries] = React.useState(null);
    const [chapter, setChapter] = React.useState(1);
    const [menu, setMenu] = React.useState(false);
    const [theme, setTheme] = React.useState('');
    const [dark, setDark] = React.useState(true);

    React.useEffect(() => {
      const html = document.documentElement;
      html.setAttribute('data-theme', theme);
      html.classList.toggle('dark', dark);
    }, [theme, dark]);

    // re-hydrate handled per-icon now (Ic renders its own SVG); no global sweep.

    const openSeries = (s) => { setSeries(s); setRoute('series'); window.scrollTo(0, 0); };
    const openChapter = (s, ch) => { setSeries(s); setChapter(ch); setRoute('reader'); };

    const showChrome = route !== 'login' && route !== 'reader' && route !== 'admin' && route !== 'series';

    return (
      <div>
        {showChrome && <Header route={route} onNav={setRoute} onOpenMenu={() => setMenu(true)} />}
        {route === 'login' && <Login onSignIn={() => setRoute('library')} />}
        {route === 'library' && <Library onOpenSeries={openSeries} onOpenChapter={openChapter} />}
        {route === 'series' && series && <Series series={series} onBack={() => setRoute('library')} onOpenChapter={openChapter} onOpenMenu={() => setMenu(true)} />}
        {route === 'reader' && series && <Reader series={series} chapter={chapter} onBack={() => setRoute('series')} />}
        {route === 'discover' && <Discover />}
        {route === 'admin' && <Admin onBack={() => setRoute('library')} onOpenMenu={() => setMenu(true)} />}
        <ProfileSheet open={menu} onClose={() => setMenu(false)} onNav={setRoute}
          theme={theme} setTheme={setTheme} dark={dark} setDark={setDark} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
