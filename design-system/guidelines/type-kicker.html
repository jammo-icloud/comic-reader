<!-- @dsCard group="Type" viewport="700x140" name="Kicker & Display" subtitle="Uppercase tracked eyebrow + the comic-title wordmark" -->
<!DOCTYPE html>
<html lang="en" class="dark" data-theme="">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .kick { display: flex; flex-direction: column; gap: 8px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }
  .wm { font-weight: 900; font-size: 44px; letter-spacing: var(--tracking-tight); color: #fff; line-height: 1; text-shadow: var(--shadow-comic-title); }
</style>
</head>
<body>
  <div class="kick">
    <span class="bindery-kicker">Continue Reading</span>
    <span class="bindery-kicker">Recommended · 12</span>
    <span class="tok">.bindery-kicker — 11px / 600 / uppercase / wide</span>
  </div>
  <div style="text-align:right">
    <div class="wm">BINDERY</div>
    <span class="tok">--shadow-comic-title (display only)</span>
  </div>
</body>
</html>
