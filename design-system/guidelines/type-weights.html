<!-- @dsCard group="Type" viewport="700x150" name="Weights & Families" subtitle="System sans body, mono for IDs, four weights" -->
<!DOCTYPE html>
<html lang="en" class="dark" data-theme="">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; display: flex; gap: 28px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .w { font-size: 17px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }
  .mono { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="col">
    <span class="w" style="font-weight:400">Regular body</span><span class="tok">400 · --weight-normal</span>
    <span class="w" style="font-weight:500">Medium label</span><span class="tok">500 · --weight-medium</span>
  </div>
  <div class="col">
    <span class="w" style="font-weight:600">Semibold heading</span><span class="tok">600 · --weight-semibold</span>
    <span class="w" style="font-weight:700">Bold title</span><span class="tok">700 · --weight-bold</span>
  </div>
  <div class="col">
    <span class="mono">mal-id: 52991</span>
    <span class="mono">/library/comics/frieren</span>
    <span class="tok">--font-mono · IDs, paths, hashes</span>
  </div>
</body>
</html>
