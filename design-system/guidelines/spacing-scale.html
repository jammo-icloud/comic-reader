<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px-based rhythm, 4→64px" -->
<!DOCTYPE html>
<html lang="en" class="dark" data-theme="">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .bar { background: var(--color-accent); height: 14px; border-radius: 3px; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); width: 130px; }
</style>
</head>
<body>
  <div class="row"><span class="tok">--space-1 · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="tok">--space-2 · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="tok">--space-3 · 12</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="tok">--space-4 · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="tok">--space-6 · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="tok">--space-8 · 32</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="tok">--space-12 · 48</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="tok">--space-16 · 64</span><span class="bar" style="width:64px"></span></div>
</body>
</html>
