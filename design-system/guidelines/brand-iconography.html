<!-- @dsCard group="Brand" viewport="700x180" name="Iconography — Lucide" subtitle="Lucide React, ~1.75–2px stroke, 16–18px in UI" -->
<!DOCTYPE html>
<html lang="en" class="dark" data-theme="">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 22px; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; color: var(--text-secondary); }
  .ic i { width: 24px; height: 24px; display: inline-flex; }
  .ic i > svg { width: 100%; height: 100%; }
  .ic span { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); }
  p { margin: 0 0 14px; font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
  <p>Bindery uses <strong>Lucide</strong> exclusively — consistent 2px stroke, no fills (except progress/play). Sizes: 18px toolbar, 16px buttons, 9–12px badge glyphs.</p>
  <div class="grid" id="g"></div>
  <script>
    const names = ['book-open','library','compass','folder-plus','download','star','heart','pin','search','arrow-down-a-z','bell','settings','shield','sun','moon','log-out','check','x','play','loader'];
    document.getElementById('g').innerHTML = names.map(n => `<span class="ic"><i data-lucide="${n}"></i><span>${n}</span></span>`).join('');
    lucide.createIcons();
  </script>
</body>
</html>
