<!DOCTYPE html>
<html lang="en" class="dark" data-theme="">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; display: flex; align-items: center; gap: 32px; }
  .marks { display: flex; align-items: center; gap: 20px; }
  .marks img { border-radius: var(--radius-md); }
  .wm { font-weight: 900; font-size: 40px; letter-spacing: var(--tracking-tight); color: #fff; line-height: 1; text-shadow: var(--shadow-comic-title); }
  .note { font-size: 12px; color: var(--text-secondary); max-width: 240px; line-height: 1.5; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); display: block; margin-top: 6px; }
</style>
</head>
<body>
  <div class="marks">
    <img src="../assets/logo.png" alt="Bindery logo" width="96" height="96" />
    <img src="../assets/logo.png" alt="Bindery logo" width="40" height="40" />
    <div class="wm">BINDERY</div>
  </div>
  <p class="note">A sleeping blue fox curled over an open book under a starry sky — calm, nocturnal reading. The wordmark uses the stacked-plate comic text-shadow.<span class="tok">assets/logo.png · 32×32 in headers</span></p>
</body>
</html>
